spring.application.name=code-review-backend

# Import optional project-local secrets configuration (GIT-IGNORED)
spring.config.import=optional:file:./application-local.properties,optional:file:application-local.properties

# H2 Database configuration with persistent file storage (PostgreSQL dialect compatible)
spring.datasource.url=jdbc:h2:file:./data/codereviewdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8080

# Jackson JSON formatting
spring.jackson.serialization.indent_output=true

# Gemini AI Review Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
gemini.enabled=true
gemini.timeout-seconds=30

